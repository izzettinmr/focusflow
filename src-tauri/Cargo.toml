[package]
name = "focusflow"
version = "1.1.0"
edition = "2021"
rust-version = "1.88"
[lib]
name = "focusflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[features]
default = ["desktop"]
desktop = ["dep:tauri-build", "dep:tauri", "dep:tauri-plugin-notification", "dep:tauri-plugin-dialog", "dep:tauri-plugin-autostart", "dep:tauri-plugin-single-instance"]
[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
thiserror = "2"
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
subtle = "2.6"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "crypto"] }
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
[[bin]]
name = "focusflow"
path = "src/main.rs"
required-features = ["desktop"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
